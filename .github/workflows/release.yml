name: Release

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Compute and print the release without publishing anything
        type: boolean
        default: true

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'

    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Pushes to master are restricted by the "Master Protection" ruleset.
          # GITHUB_TOKEN cannot be granted bypass, so the push authenticates as
          # the token's owner, who is on the ruleset's bypass list.
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Plan the release
        id: plan
        run: |
          CURRENT=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"

          set +e
          PLAN=$(python3 scripts/release.py plan --current-version "$CURRENT" --changeset-dir .changeset)
          STATUS=$?
          set -e

          if [ "$STATUS" -eq 3 ]; then
            echo "No changesets present - nothing to release."
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$STATUS" -ne 0 ]; then
            echo "$PLAN"
            exit "$STATUS"
          fi

          echo "$PLAN"
          echo "release=true" >> "$GITHUB_OUTPUT"
          NEXT=$(echo "$PLAN" | python3 -c 'import json,sys; print(json.load(sys.stdin)["next"])')
          echo "next=$NEXT" >> "$GITHUB_OUTPUT"

          DELIM="PLANEOF_$(openssl rand -hex 8)"
          {
            echo "plan_json<<$DELIM"
            echo "$PLAN"
            echo "$DELIM"
          } >> "$GITHUB_OUTPUT"

      - name: Apply the version and changelog
        if: steps.plan.outputs.release == 'true'
        env:
          CURRENT: ${{ steps.plan.outputs.current }}
          NEXT: ${{ steps.plan.outputs.next }}
        run: |
          mvn -B versions:set -DnewVersion="$NEXT" -DgenerateBackupPoms=false
          python3 scripts/release.py apply \
            --current-version "$CURRENT" \
            --changeset-dir .changeset \
            --readme README.md \
            --date "$(date -u +%Y-%m-%d)"

      - name: Build and test
        if: steps.plan.outputs.release == 'true'
        run: mvn -B clean verify

      - name: Stop here on a dry run
        if: steps.plan.outputs.release == 'true' && inputs.dry_run
        env:
          PLAN_JSON: ${{ steps.plan.outputs.plan_json }}
        run: |
          echo "Dry run. Nothing has been committed, tagged or published."
          echo "--- README changelog diff ---"
          git --no-pager diff -- README.md
          echo "--- release plan ---"
          echo "$PLAN_JSON"

      - name: Dry run - resolve BukkitDev game versions
        if: steps.plan.outputs.release == 'true' && inputs.dry_run
        env:
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
        run: |
          if [ -z "${CURSEFORGE_TOKEN:-}" ]; then
            echo "CURSEFORGE_TOKEN is not set - skipping game-version resolution."
            exit 0
          fi
          curl -sS -H "X-Api-Token: $CURSEFORGE_TOKEN" https://dev.bukkit.org/api/game/versions \
            | python3 -c '
          import json, sys
          versions = json.load(sys.stdin)
          matched = [v for v in versions if str(v.get("name", "")).startswith("1.21")]
          print("Resolved %d game versions for 1.21:" % len(matched))
          for v in matched:
              print("  %s -> %s" % (v.get("name"), v.get("id")))
          if not matched:
              sys.exit("No 1.21 game versions matched - the live upload would fail here.")
          '

      - name: Commit and tag
        if: steps.plan.outputs.release == 'true' && !inputs.dry_run
        env:
          NEXT: ${{ steps.plan.outputs.next }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pom.xml README.md .changeset
          git commit -m "chore(release): $NEXT"
          git tag -a "v$NEXT" -m "Release $NEXT"
          git push origin HEAD:master --follow-tags
          git ls-remote --exit-code --tags origin "refs/tags/v$NEXT" > /dev/null \
            || { echo "Tag v$NEXT did not reach the remote"; exit 1; }

      - name: Rename the jar to the release convention
        if: steps.plan.outputs.release == 'true' && !inputs.dry_run
        env:
          NEXT: ${{ steps.plan.outputs.next }}
        run: cp "target/SetHomesTwo-$NEXT.jar" "SetHomesTwo.V$NEXT.jar"

      - name: Publish to BukkitDev
        if: steps.plan.outputs.release == 'true' && !inputs.dry_run
        env:
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
          VERSION: ${{ steps.plan.outputs.next }}
        run: bash scripts/publish-bukkitdev.sh

      - name: Publish the GitHub Release
        if: steps.plan.outputs.release == 'true' && !inputs.dry_run
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          VERSION: ${{ steps.plan.outputs.next }}
        run: |
          NOTES=$(python3 - <<'PY'
          import re, io
          text = io.open("README.md", encoding="utf-8").read()
          import os
          version = os.environ["VERSION"]
          match = re.search(r"^#### " + re.escape(version) + r" \(.*?\)\n\n(.*?)(?=\n#### |\Z)", text, re.S | re.M)
          print(match.group(1).strip() if match else "")
          PY
          )
          gh release create "v$VERSION" "SetHomesTwo.V$VERSION.jar" \
            --title "SetHomesTwo V$VERSION" \
            --notes "$NOTES"
