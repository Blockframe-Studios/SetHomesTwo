name: Tests

on:
  push:
  pull_request:

# Supersede an in-flight run when the same ref is pushed again, so a burst of
# commits does not queue duplicate builds.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build and test
        run: mvn -B verify

      - name: Run the release script tests
        run: python3 scripts/test_release.py

      - name: Validate changesets
        run: |
          python3 scripts/release.py plan --current-version 0.0.0 --changeset-dir .changeset || [ $? -eq 3 ]
