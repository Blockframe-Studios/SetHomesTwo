name: Tests

on:
  push:
  pull_request:

# Supersede an in-flight run when the same ref is pushed again, so a burst of
# commits does not queue duplicate builds.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build and test
        run: mvn -B verify

      - name: Run the release script tests
        run: bash scripts/test-release.sh

      - name: Run the changeset gate tests
        run: bash scripts/test-require-changeset.sh

      # Rehearses the release on every pull request. The changelog heading went
      # missing in a docs change, and nothing noticed until a release ran.
      - name: Check a release could be applied
        run: bash scripts/release.sh check --changeset-dir .changeset --readme README.md
