name: E2E

# On pull requests rather than on a schedule. Releases pool on dev for weeks at
# a time, so a nightly mostly re-ran an unchanged commit; the drift it existed
# to catch (the Paper download, the pinned anvilgui snapshot, the npm
# toolchain) surfaces on the next pull request anyway, which is when it matters.
# Still not on every push: the suite pays server boot before its first
# assertion, which is wasted on a branch with no pull request open yet.
on:
  pull_request:
  workflow_dispatch:

# Supersede an in-flight run when the same pull request is pushed to again, so
# a burst of commits does not queue duplicate server boots.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      # The unit suite already ran in Tests on this commit; no reason to pay twice.
      - name: Build the plugin jar
        run: mvn -B clean package -DskipTests

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run the end-to-end suite
        run: ./gradlew plugwrightTest --no-daemon

      # A red run with no server log is not actionable.
      - name: Upload the server logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-server-logs
          path: run/logs/
          if-no-files-found: warn
